<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="badge-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="1" stop-color="#ffbe3d"/>
    </linearGradient>

    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="920" fill="#f1f3f6"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="1540" height="74" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <g transform="translate(50, 31) scale(0.11)">
    <rect width="512" height="512" rx="112" fill="url(#night)"/>
    <polygon points="160,196 352,196 440,460 72,460" fill="url(#beam)"/>
    <polygon points="196,92 316,92 352,196 160,196" fill="url(#glass)"/>
    <g fill="none" stroke="#f5f7fb" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="196,92 316,92 352,196 160,196"/>
      <line x1="256" y1="92" x2="256" y2="196"/>
      <line x1="178" y1="144" x2="334" y2="144"/>
    </g>
    <path transform="translate(226 270) scale(1.15)" d="M0 0 L0 120 L32 92 L54 140 L76 130 L54 84 L96 84 Z" fill="#f5f7fb" stroke="#0b1d3a" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <text x="122" y="55" font-size="22" font-weight="800" fill="#0f172a">LUCARNA — Flujo de Funcionamiento, Túneles y Modelo «Zero-Trust sin Nube Propia»</text>
  <text x="122" y="79" font-size="14" font-weight="500" fill="#475569">Cómo viajan la pantalla, el teclado y los archivos de forma cifrada, y cómo se iguala a AnyDesk/TeamViewer sin exponer puertos VNC</text>

  <!-- ==================== LANE 1: TÚNEL SSH INTEGRADO + LOOPBACK (PRINCIPAL) ==================== -->
  <rect x="30" y="116" width="1540" height="252" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="116" width="1540" height="36" rx="14" fill="#dcfce7"/>
  <text x="54" y="140" font-size="15" font-weight="800" fill="#14532d">MODO 1 (RECOMENDADO): Túnel SSH Integrado + Servidor VNC en Loopback (Puerto 5900 Cerrado al Exterior)</text>

  <!-- Step 1.1: Técnico + Keychain -->
  <g transform="translate(130, 232)">
    <circle cx="0" cy="0" r="40" fill="#6d28d9" filter="url(#badge-shadow)"/>
    <path d="M0 -20 L16 -12 L16 2 C16 14 0 21 0 21 C0 21 -16 14 -16 2 L-16 -12 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="-2" r="4" fill="#ffffff"/>
    <text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1. Llavero + Askpass</text>
    <text x="0" y="75" text-anchor="middle" font-size="11.5" fill="#475569">Llave SSH o contraseña vía</text>
    <text x="0" y="90" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="600">SSH_ASKPASS (sin argv)</text>
  </g>

  <!-- Step 1.2: Lucarna Session Socket -->
  <g transform="translate(405, 232)">
    <circle cx="0" cy="0" r="40" fill="#2563eb" filter="url(#badge-shadow)"/>
    <rect x="-18" y="-13" width="36" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2. Puerto Efímero Local</text>
    <text x="0" y="75" text-anchor="middle" font-size="11.5" fill="#475569">Lucarna conecta su socket a</text>
    <text x="0" y="90" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="600">127.0.0.1:P (local)</text>
  </g>

  <!-- Step 1.3: Encrypted SSH Pipe -->
  <g transform="translate(765, 232)">
    <rect x="-175" y="-38" width="350" height="76" rx="38" fill="#15803d" filter="url(#badge-shadow)"/>
    <circle cx="-130" cy="0" r="24" fill="#ffffff"/>
    <rect x="-139" y="-2" width="18" height="13" rx="2" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <path d="M-135 -2 L-135 -7 C-135 -11 -125 -11 -125 -7 L-125 -2" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <text x="-94" y="-6" text-anchor="start" font-size="13.5" font-weight="800" fill="#ffffff">TÚNEL CIFRADO SSHv2 (Puerto 22)</text>
    <text x="-94" y="13" text-anchor="start" font-size="11.5" fill="#dcfce7">Pantalla (Tight/ZRLE) + Teclado + FT + SFTP</text>
    <text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">3. Transporte Cifrado por Internet</text>
    <text x="0" y="75" text-anchor="middle" font-size="11.5" fill="#475569">Ed25519 / ChaCha20-Poly1305 · Host Key Pinning</text>
  </g>

  <!-- Step 1.4: Remote SSHD -->
  <g transform="translate(1135, 232)">
    <circle cx="0" cy="0" r="40" fill="#0f172a" filter="url(#badge-shadow)"/>
    <path d="M-14 -6 L-4 2 L-14 10 M-1 10 L13 10" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
    <text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">4. OpenSSH Server</text>
    <text x="0" y="75" text-anchor="middle" font-size="11.5" fill="#475569">Desencapsula y entrega a</text>
    <text x="0" y="90" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="600">localhost:5900 + subsistema sftp</text>
  </g>

  <!-- Step 1.5: Remote VNC Server on Loopback -->
  <g transform="translate(1425, 232)">
    <circle cx="0" cy="0" r="40" fill="#c026d3" filter="url(#badge-shadow)"/>
    <rect x="-16" y="-14" width="32" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-8" y1="14" x2="8" y2="14" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">5. Servidor VNC Remoto</text>
    <text x="0" y="75" text-anchor="middle" font-size="11.5" fill="#475569">UltraVNC / x11vnc escuchando</text>
    <text x="0" y="90" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">SOLO en 127.0.0.1 (Loopback)</text>
  </g>

  <!-- Lane 1 Arrows -->
  <line x1="175" y1="232" x2="358" y2="232" stroke="#6d28d9" stroke-width="2.8" marker-end="url(#arrow-purple)"/>
  <line x1="452" y1="232" x2="584" y2="232" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="946" y1="232" x2="1088" y2="232" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1182" y1="232" x2="1378" y2="232" stroke="#1e293b" stroke-width="2.8" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>

  <!-- ==================== LANE 2: ACCESO DESATENDIDO SIN ABRIR PUERTOS (ESTILO ANYDESK EMPRESARIAL) ==================== -->
  <rect x="30" y="390" width="1540" height="242" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="390" width="1540" height="36" rx="14" fill="#dbeafe"/>
  <text x="54" y="414" font-size="15" font-weight="800" fill="#1e3a8a">MODO 2: Acceso Desatendido Detrás de NAT sin Abrir Puertos (Tailscale / WireGuard / Cloudflare Tunnel / ProxyJump)</text>

  <!-- Step 2.1: Discovery in Address Book -->
  <g transform="translate(150, 502)">
    <circle cx="0" cy="0" r="38" fill="#2563eb" filter="url(#badge-shadow)"/>
    <circle cx="-3" cy="-3" r="11" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <line x1="5" y1="5" x2="15" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Auto-Descubrimiento</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">tailscale status --json / mDNS</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#2563eb" font-weight="600">+ Wake-on-LAN (WoL)</text>
  </g>

  <!-- Step 2.2: Overlay Network / Bastion -->
  <g transform="translate(550, 502)">
    <rect x="-150" y="-36" width="300" height="72" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="-105" cy="0" r="22" fill="#2563eb"/>
    <path d="M-115 4 C-115 -6 -95 -6 -95 4" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <circle cx="-105" cy="-6" r="4" fill="#ffffff"/>
    <text x="20" y="-6" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e3a8a">Red Zero-Trust / Bastión SSH</text>
    <text x="20" y="13" text-anchor="middle" font-size="11.5" fill="#475569">WireGuard P2P · cloudflared · ssh -J</text>
    <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Atraviesa NAT y CGNAT sin Nube de Lucarna</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Autenticación por identidad / SSO / Llaves</text>
  </g>

  <!-- Step 2.3: Multi-Monitor & NOC View -->
  <g transform="translate(995, 502)">
    <circle cx="0" cy="0" r="38" fill="#d97706" filter="url(#badge-shadow)"/>
    <rect x="-19" y="-12" width="17" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="2" y="-12" width="17" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="-19" y="4" width="17" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="2" y="4" width="17" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Vista Mosaico NOC / Pestañas</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Monitoreo simultáneo +</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="600">Selector de Monitor Remoto</text>
  </g>

  <!-- Step 2.4: Target Fleet -->
  <g transform="translate(1395, 502)">
    <circle cx="0" cy="0" r="38" fill="#16a34a" filter="url(#badge-shadow)"/>
    <rect x="-16" y="-14" width="32" height="28" rx="3" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M-9 2 L-2 8 L10 -6" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Flota de Equipos Remotos</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Oficinas, Servidores Cloud, VMs</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="600">Sin agentes con permisos SYSTEM</text>
  </g>

  <!-- Lane 2 Arrows -->
  <line x1="194" y1="502" x2="392" y2="502" stroke="#1e293b" stroke-width="2.8" marker-end="url(#arrow-dark)"/>
  <line x1="708" y1="502" x2="950" y2="502" stroke="#1e293b" stroke-width="2.8" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <line x1="1040" y1="502" x2="1350" y2="502" stroke="#15803d" stroke-width="2.8" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  <!-- ==================== LANE 3: SOPORTE BAJO DEMANDA "QUICKSUPPORT" INVERSO ==================== -->
  <rect x="30" y="654" width="1540" height="242" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="654" width="1540" height="36" rx="14" fill="#fef3c7"/>
  <text x="54" y="678" font-size="15" font-weight="800" fill="#92400e">MODO 3: Asistencia Rápida Bajo Demanda («QuickSupport Inverso» con Token Efímero de Un Solo Uso)</text>

  <!-- Step 3.1: Technician Listen Mode -->
  <g transform="translate(150, 766)">
    <circle cx="0" cy="0" r="38" fill="#d97706" filter="url(#badge-shadow)"/>
    <path d="M-12 -8 L12 -8 L12 12 L-12 12 Z" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M-6 -14 L6 -14" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1. Modo «Esperar Asistencia»</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Técnico genera invitación con</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="600">Token Efímero (1 solo uso)</text>
  </g>

  <!-- Step 3.2: Private SSH Relay / Repeater II -->
  <g transform="translate(550, 766)">
    <circle cx="0" cy="0" r="38" fill="#7c3aed" filter="url(#badge-shadow)"/>
    <path d="M-16 0 L16 0 M6 -8 L16 0 L6 8 M-6 -8 L-16 0 L-6 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2. Punto de Encuentro Cifrado</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Túnel SSH Inverso (ssh -R) o</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="600">Repetidor Modo II (ID:1234) bajo SSH</text>
  </g>

  <!-- Step 3.3: Remote User Consent -->
  <g transform="translate(995, 766)">
    <circle cx="0" cy="0" r="38" fill="#0284c7" filter="url(#badge-shadow)"/>
    <path d="M-14 0 L-4 10 L15 -10" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3. Cliente Acepta e Inicia</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Conexión saliente desde el cliente</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#0369a1" font-weight="600">(No abre puertos en su router)</text>
  </g>

  <!-- Step 3.4: Audit & Auto-Destroy -->
  <g transform="translate(1395, 766)">
    <circle cx="0" cy="0" r="38" fill="#dc2626" filter="url(#badge-shadow)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">4. Grabación &amp; Revocación</text>
    <text x="0" y="73" text-anchor="middle" font-size="11.5" fill="#475569">Chat + Archivos + Evidencia .fbs</text>
    <text x="0" y="88" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">El token muere al desconectar</text>
  </g>

  <!-- Lane 3 Arrows -->
  <line x1="194" y1="766" x2="504" y2="766" stroke="#d97706" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
  <line x1="950" y1="766" x2="596" y2="766" stroke="#6d28d9" stroke-width="2.8" marker-end="url(#arrow-purple)"/>
  <line x1="1040" y1="766" x2="1350" y2="766" stroke="#1e293b" stroke-width="2.8" marker-end="url(#arrow-dark)"/>
</svg>
