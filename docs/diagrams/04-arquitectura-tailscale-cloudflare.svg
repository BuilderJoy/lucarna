  </g>

  <!-- ==================== CENTER TOP: RUTA A — TAILSCALE / WIREGUARD MESH ==================== -->
  <rect x="385" y="118" width="790" height="378" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="385" y="118" width="790" height="42" rx="16" fill="#dbeafe"/>
  <text x="412" y="145" font-size="15.5" font-weight="800" fill="#1e3a8a">OPCIÓN A: Red en Malla Tailscale / WireGuard (Conexión Directa P2P Punto a Punto)</text>

  <!-- Tailscale Control Plane & ACLs -->
  <g transform="translate(560, 240)">
    <rect x="-148" y="-52" width="296" height="104" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="-106" cy="0" r="26" fill="#1e293b"/>
    <circle cx="-115" cy="-9" r="3" fill="#38bdf8"/>
    <circle cx="-106" cy="-9" r="3" fill="#ffffff"/>
    <circle cx="-97" cy="-9" r="3" fill="#38bdf8"/>
    <circle cx="-115" cy="0" r="3" fill="#ffffff"/>
    <circle cx="-106" cy="0" r="3" fill="#ffffff"/>
    <circle cx="-97" cy="0" r="3" fill="#ffffff"/>
    <circle cx="-115" cy="9" r="3" fill="#38bdf8"/>
    <circle cx="-106" cy="9" r="3" fill="#ffffff"/>
    <circle cx="-97" cy="9" r="3" fill="#38bdf8"/>
