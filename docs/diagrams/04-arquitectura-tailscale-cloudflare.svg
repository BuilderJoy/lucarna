    <circle cx="0" cy="-42" r="28" fill="#0f172a" filter="url(#badge-shadow)"/>
    <path d="M-12 -46 L-3 -39 L-12 -32 M1 -32 L12 -32" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
    <text x="0" y="4" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">Agentes Auditados de Red</text>
    <text x="0" y="26" text-anchor="middle" font-size="12" fill="#334155">• tailscaled (interfaz tailscale0)</text>
    <text x="0" y="45" text-anchor="middle" font-size="12" fill="#334155">• cloudflared service (tcp://localhost)</text>
    <text x="0" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">• OpenSSH Server (Puerto 22 interno)</text>
  </g>

  <!-- Loopback VNC Server -->
  <g transform="translate(1390, 735)">
    <rect x="-145" y="-85" width="290" height="185" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="0" cy="-40" r="30" fill="#15803d" filter="url(#badge-shadow)"/>
    <rect x="-14" y="-50" width="28" height="18" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="-7" y1="-27" x2="7" y2="-27" stroke="#ffffff" stroke-width="2.4"/>
    <text x="0" y="8" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">UltraVNC / x11vnc / macOS</text>
    <text x="0" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Escuchando SOLO en 127.0.0.1:5900</text>
    <text x="0" y="50" text-anchor="middle" font-size="12" fill="#334155">• LoopbackOnly=1 en ultravnc.ini</text>
    <text x="0" y="68" text-anchor="middle" font-size="12" fill="#334155">• MS-Logon III + File Transfer</text>
    <text x="0" y="86" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">• + Archivos por SFTP v3 (Fase 8.2)</text>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Lucarna -> Tailscale & Cloudflared local -->
  <line x1="190" y1="355" x2="190" y2="418" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <path d="M 140 250 L 44 250 L 44 635 L 55 635" fill="none" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)"/>

  <!-- Local Tailscale -> Tailscale Option A -->
  <line x1="322" y1="455" x2="406" y2="415" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="295" x2="560" y2="348" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-blue)"/>
  <line x1="710" y1="405" x2="838" y2="355" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1138" y1="322" x2="1238" y2="430" stroke="#2563eb" stroke-width="3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <!-- Local cloudflared -> Cloudflare Option B -->
  <line x1="322" y1="648" x2="406" y2="648" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
  <line x1="322" y1="665" x2="406" y2="800" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="560" y1="705" x2="560" y2="755" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)"/>
  <line x1="710" y1="815" x2="838" y2="765" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="1238" y1="500" x2="1138" y2="710" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Remote Daemons -> Loopback VNC -->
  <line x1="1390" y1="552" x2="1390" y2="644" stroke="#15803d" stroke-width="3.2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
</svg>
