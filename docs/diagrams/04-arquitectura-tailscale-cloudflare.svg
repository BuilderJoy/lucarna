    <text x="-68" y="-2" font-size="11" fill="#475569">• Intercambio de claves públicas</text>
    <text x="-68" y="15" font-size="11" fill="#475569">• Políticas Zero-Trust (puerto 5900/22)</text>
    <text x="-68" y="32" font-size="11" font-weight="700" fill="#15803d">• NUNCA ve tus datos ni tu pantalla</text>
  </g>

  <!-- WireGuard Data Plane P2P Tunnel -->
  <g transform="translate(560, 405)">
    <rect x="-148" y="-52" width="296" height="104" rx="12" fill="#1d4ed8" filter="url(#badge-shadow)"/>
    <circle cx="-106" cy="0" r="26" fill="#ffffff"/>
    <path d="M-106 -14 L-93 -7 L-93 3 C-93 11 -106 16 -106 16 C-106 16 -119 11 -119 3 L-119 -7 Z" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
    <text x="-68" y="-18" font-size="13.5" font-weight="800" fill="#ffffff">Túnel P2P WireGuard</text>
    <text x="-68" y="1" font-size="11" fill="#dbeafe">• Cifrado Noise / ChaCha20-Poly1305</text>
    <text x="-68" y="18" font-size="11" fill="#dbeafe">• NAT Hole Punching (STUN / ICE)</text>
    <text x="-68" y="35" font-size="11" font-weight="700" fill="#fde047">• Latencia mínima (directo entre IPs)</text>
  </g>

  <!-- Tailscale SSH & DERP Fallback -->
  <g transform="translate(990, 322)">
    <rect x="-145" y="-120" width="290" height="240" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="-68" r="32" fill="#2563eb" filter="url(#badge-shadow)"/>
    <path d="M-14 -68 L14 -68 M6 -76 L14 -68 L6 -60 M-6 -76 L-14 -68 L-6 -60" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="0" y="-18" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Ventajas para Lucarna</text>
    <text x="-125" y="10" font-size="12" fill="#334155">1. Conecta por nombre MagicDNS:</text>
    <text x="-112" y="28" font-size="12" font-weight="700" fill="#2563eb">oficina-pc.tailnet.ts.net:5900</text>
    <text x="-125" y="52" font-size="12" fill="#334155">2. Tailscale SSH opcional: autentica</text>
    <text x="-112" y="70" font-size="12" fill="#475569">el túnel SSH sin gestionar llaves.</text>
    <text x="-125" y="94" font-size="12" fill="#334155">3. Relé DERP cifrado E2E automático</text>
    <text x="-112" y="110" font-size="12" fill="#475569">si un firewall corporativo bloquea UDP.</text>
  </g>

  <!-- ==================== CENTER BOTTOM: RUTA B — CLOUDFLARE TUNNEL + ACCESS ==================== -->
  <rect x="385" y="522" width="790" height="386" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="385" y="522" width="790" height="42" rx="16" fill="#ffedd5"/>
  <text x="412" y="549" font-size="15.5" font-weight="800" fill="#9a3412">OPCIÓN B: Cloudflare Tunnel (cloudflared) + Cloudflare Access (Zero-Trust Corporativo)</text>

  <!-- Identity Provider + Cloudflare Access -->
  <g transform="translate(560, 648)">
    <rect x="-148" y="-54" width="296" height="108" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="-106" cy="0" r="26" fill="#7c3aed"/>
    <rect x="-120" y="-12" width="28" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="2.3"/>
    <circle cx="-110" cy="-2" r="4" fill="#ffffff"/>
    <line x1="-102" y1="-2" x2="-96" y2="-2" stroke="#ffffff" stroke-width="2"/>
    <text x="-68" y="-22" font-size="13.5" font-weight="800" fill="#0f172a">1. Cloudflare Access (SSO)</text>
    <text x="-68" y="-3" font-size="11" fill="#475569">• Login con Google, GitHub, Okta,</text>
    <text x="-68" y="14" font-size="11" fill="#475569">  Microsoft Entra ID + MFA / FIDO2</text>
    <text x="-68" y="33" font-size="11" font-weight="700" fill="#6d28d9">• Verifica identidad antes de abrir TCP</text>
  </g>

  <!-- Cloudflare Edge Network -->
  <g transform="translate(560, 815)">
    <rect x="-148" y="-54" width="296" height="108" rx="12" fill="#ea580c" filter="url(#badge-shadow)"/>
    <circle cx="-106" cy="0" r="26" fill="#ffffff"/>
    <path d="M-120 7 L-92 7 C-88 7 -86 2 -90 -1 C-90 -6 -95 -9 -100 -7 C-103 -13 -112 -13 -114 -6 C-119 -6 -123 -1 -120 7 Z" fill="#ea580c"/>
    <text x="-68" y="-20" font-size="13.5" font-weight="800" fill="#ffffff">2. Red Edge Anycast (TLS)</text>
    <text x="-68" y="-1" font-size="11" fill="#ffedd5">• vnc.empresa.com (sin IP pública)</text>
    <text x="-68" y="16" font-size="11" fill="#ffedd5">• Protección DDoS y registro de</text>
    <text x="-68" y="33" font-size="11" font-weight="700" fill="#fde047">  auditoría por usuario y sesión</text>
  </g>

  <!-- Outbound-Only cloudflared Connector -->
  <g transform="translate(990, 730)">
    <rect x="-145" y="-120" width="290" height="240" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="-68" r="32" fill="#ea580c" filter="url(#badge-shadow)"/>
    <path d="M-14 -68 L14 -68 M4 -78 L14 -68 L4 -58" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <text x="0" y="-18" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">Conector Saliente (Outbound)</text>
    <text x="-125" y="10" font-size="12" fill="#334155">1. El servidor remoto inicia 4 túneles</text>
    <text x="-112" y="28" font-size="12" font-weight="700" fill="#ea580c">salientes QUIC / HTTP2 hacia el Edge.</text>
    <text x="-125" y="52" font-size="12" fill="#334155">2. Firewall entrante 100% cerrado:</text>
    <text x="-112" y="70" font-size="12" fill="#475569">cero puertos abiertos en el router.</text>
    <text x="-125" y="94" font-size="12" fill="#15803d" font-weight="700">3. Recomendación Lucarna: tunelar SSH</text>
    <text x="-112" y="110" font-size="12" fill="#15803d" font-weight="700">dentro de Cloudflare para cifrado E2E.</text>
  </g>

  <!-- ==================== RIGHT COLUMN: SERVIDOR REMOTO BLINDADO ==================== -->
  <rect x="1210" y="118" width="360" height="790" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1210" y="118" width="360" height="42" rx="16" fill="#dcfce7"/>
  <text x="1390" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">SERVIDOR REMOTO (DETRÁS DE NAT)</text>

  <!-- Firewall Badge: Zero Inbound Ports -->
  <g transform="translate(1390, 235)">
    <rect x="-145" y="-44" width="290" height="88" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <circle cx="-102" cy="0" r="26" fill="#dc2626"/>
    <path d="M-112 -10 L-92 10 M-92 -10 L-112 10" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <text x="-64" y="-12" font-size="14" font-weight="800" fill="#991b1b">Firewall / Router Local</text>
    <text x="-64" y="8" font-size="12" fill="#7f1d1d" font-weight="700">• 0 Puertos Abiertos a Internet</text>
    <text x="-64" y="26" font-size="11.5" fill="#475569">• Invisible a escaneos Shodan / Censys</text>
  </g>

  <!-- Remote Daemons (tailscaled / cloudflared / sshd) -->
  <g transform="translate(1390, 465)">
