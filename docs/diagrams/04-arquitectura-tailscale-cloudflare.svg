<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="badge-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <!-- Lucarna Logo Gradients -->
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="1" stop-color="#ffbe3d"/>
    </linearGradient>

    <!-- Arrowhead Markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="940" fill="#f1f3f6"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="1540" height="74" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <g transform="translate(50, 31) scale(0.11)">
    <rect width="512" height="512" rx="112" fill="url(#night)"/>
    <polygon points="160,196 352,196 440,460 72,460" fill="url(#beam)"/>
    <polygon points="196,92 316,92 352,196 160,196" fill="url(#glass)"/>
    <g fill="none" stroke="#f5f7fb" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="196,92 316,92 352,196 160,196"/>
      <line x1="256" y1="92" x2="256" y2="196"/>
      <line x1="178" y1="144" x2="334" y2="144"/>
    </g>
    <path transform="translate(226 270) scale(1.15)" d="M0 0 L0 120 L32 92 L54 140 L76 130 L54 84 L96 84 Z" fill="#f5f7fb" stroke="#0b1d3a" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <text x="122" y="55" font-size="22" font-weight="800" fill="#0f172a">LUCARNA — Arquitectura de Conectividad Zero-Trust: Tailscale &amp; Cloudflare Tunnel</text>
  <text x="122" y="79" font-size="14" font-weight="500" fill="#475569">Cómo atravesar NAT y CGNAT sin abrir el puerto 5900 ni mantener servidores propios, combinando mallas WireGuard y túneles Zero-Trust</text>

  <!-- ==================== LEFT COLUMN: EQUIPO DEL TÉCNICO (LUCARNA) ==================== -->
  <rect x="30" y="118" width="320" height="790" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="118" width="320" height="42" rx="16" fill="#e2e8f0"/>
  <text x="190" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">EQUIPO DEL TÉCNICO (CLIENTE)</text>

  <!-- Lucarna App Node -->
  <g transform="translate(190, 245)">
    <rect x="-44" y="-44" width="88" height="88" rx="20" fill="url(#night)" filter="url(#badge-shadow)"/>
    <polygon points="-18,-10 18,-10 34,34 -34,34" fill="url(#beam)"/>
    <polygon points="-12,-28 12,-28 18,-10 -18,-10" fill="url(#glass)" stroke="#f5f7fb" stroke-width="2.2"/>
    <path d="M-4 2 L-4 24 L2 18 L6 27 L10 25 L6 16 L14 16 Z" fill="#f5f7fb"/>
    <text x="0" y="66" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0f172a">Lucarna Viewer</text>
    <text x="0" y="84" text-anchor="middle" font-size="12" fill="#475569">Address Book + Sesión RFB/SFTP</text>
    <text x="0" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Credenciales en Keychain del SO</text>
  </g>

  <!-- Local Tailscale Client Badge -->
  <g transform="translate(190, 465)">
    <rect x="-130" y="-42" width="260" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <!-- Tailscale 3x3 dot grid logo -->
    <circle cx="-90" cy="5" r="28" fill="#1e293b" filter="url(#badge-shadow)"/>
    <circle cx="-101" cy="-6" r="3.5" fill="#94a3b8"/>
    <circle cx="-90" cy="-6" r="3.5" fill="#ffffff"/>
    <circle cx="-79" cy="-6" r="3.5" fill="#94a3b8"/>
    <circle cx="-101" cy="5" r="3.5" fill="#ffffff"/>
    <circle cx="-90" cy="5" r="3.5" fill="#ffffff"/>
    <circle cx="-79" cy="5" r="3.5" fill="#ffffff"/>
    <circle cx="-101" cy="16" r="3.5" fill="#94a3b8"/>
    <circle cx="-90" cy="16" r="3.5" fill="#ffffff"/>
    <circle cx="-79" cy="16" r="3.5" fill="#38bdf8"/>
    <text x="-48" y="-8" font-size="14" font-weight="800" fill="#1e3a8a">Cliente Tailscale Local</text>
    <text x="-48" y="10" font-size="11.5" fill="#334155">• Interfaz utun / 100.x.y.z</text>
    <text x="-48" y="26" font-size="11.5" fill="#334155">• MagicDNS (.ts.net)</text>
    <text x="-48" y="42" font-size="11" font-weight="700" fill="#2563eb">• Auto-discovery: tailscale status</text>
  </g>

  <!-- Local cloudflared Client Badge -->
  <g transform="translate(190, 635)">
    <rect x="-130" y="-42" width="260" height="94" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
    <!-- Cloudflare orange cloud logo -->
    <circle cx="-90" cy="5" r="28" fill="#ea580c" filter="url(#badge-shadow)"/>
    <path d="M-106 12 L-74 12 C-70 12 -68 7 -72 4 C-72 -2 -78 -5 -83 -3 C-86 -9 -96 -9 -99 -2 C-104 -2 -109 3 -106 12 Z" fill="#ffffff"/>
    <text x="-48" y="-8" font-size="14" font-weight="800" fill="#9a3412">cloudflared access tcp</text>
    <text x="-48" y="10" font-size="11.5" fill="#334155">• Escucha en 127.0.0.1:P local</text>
    <text x="-48" y="26" font-size="11.5" fill="#334155">• Valida token SSO / MFA</text>
    <text x="-48" y="42" font-size="11" font-weight="700" fill="#ea580c">• Lanzado por Lucarna al conectar</text>
  </g>

  <!-- Optional Inner SSH Layer Badge -->
  <g transform="translate(190, 795)">
    <rect x="-130" y="-36" width="260" height="82" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="-90" cy="5" r="24" fill="#15803d"/>
    <rect x="-98" y="3" width="16" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M-94 3 L-94 -2 C-94 -6 -86 -6 -86 -2 L-86 3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
