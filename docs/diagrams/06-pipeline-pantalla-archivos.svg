<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="badge-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="1" stop-color="#ffbe3d"/>
    </linearGradient>

    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="920" fill="#f1f3f6"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="1540" height="74" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <g transform="translate(50, 31) scale(0.11)">
    <rect width="512" height="512" rx="112" fill="url(#night)"/>
    <polygon points="160,196 352,196 440,460 72,460" fill="url(#beam)"/>
    <polygon points="196,92 316,92 352,196 160,196" fill="url(#glass)"/>
    <g fill="none" stroke="#f5f7fb" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="196,92 316,92 352,196 160,196"/>
      <line x1="256" y1="92" x2="256" y2="196"/>
      <line x1="178" y1="144" x2="334" y2="144"/>
    </g>
    <path transform="translate(226 270) scale(1.15)" d="M0 0 L0 120 L32 92 L54 140 L76 130 L54 84 L96 84 Z" fill="#f5f7fb" stroke="#0b1d3a" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <text x="122" y="55" font-size="22" font-weight="800" fill="#0f172a">LUCARNA — Tubería Gráfica de 60 FPS y Motor Dual de Archivos (UltraVNC FT + SFTP v3)</text>
  <text x="122" y="79" font-size="14" font-weight="500" fill="#475569">Cómo se decodifican los rectángulos de video en tiempo real sin bloquear la interfaz y cómo operan las transferencias de archivos en hilos separados</text>

  <!-- ==================== TOP SECTION: TUBERÍA DE LA PANTALLA REMOTA (60 FPS) ==================== -->
  <rect x="30" y="116" width="1540" height="370" rx="16" fill="#ffffff" stroke="#f59e0b" stroke-width="2.2" filter="url(#shadow)"/>
  <rect x="30" y="116" width="1540" height="40" rx="16" fill="#fef3c7"/>
  <text x="54" y="142" font-size="15.5" font-weight="800" fill="#92400e">1. TUBERÍA DE PANTALLA Y CURSOR LOCAL (src/features/remote_screen/ · Cero Bloqueos en UI)</text>

  <!-- Node S1: Socket BufReader -->
  <g transform="translate(150, 295)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" filter="url(#badge-shadow)"/>
    <path d="M-16 -6 L16 -6 M6 -14 L16 -6 L6 2 M-16 8 L16 8" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
    <text x="0" y="62" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">1. BufReader (64 KiB)</text>
    <text x="0" y="80" text-anchor="middle" font-size="11.5" fill="#475569">Hilo lector lee mensaje 0</text>
    <text x="0" y="96" text-anchor="middle" font-size="11.5" fill="#0369a1" font-weight="700">(FramebufferUpdate)</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#64748b">Valida x, y, w, h &lt; MAX_DIM</text>
  </g>

  <!-- Node S2: Persistent Decoder -->
  <g transform="translate(495, 295)">
    <rect x="-155" y="-95" width="310" height="190" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-105" cy="-42" r="26" fill="#d97706" filter="url(#badge-shadow)"/>
    <rect x="-117" y="-54" width="24" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="2.3"/>
    <text x="-65" y="-46" font-size="14.5" font-weight="800" fill="#92400e">2. Decoder Persistente</text>
    <text x="-65" y="-28" font-size="11.5" fill="#475569">Flujos zlib vivos toda la sesión</text>
    <line x1="-135" y1="-8" x2="135" y2="-8" stroke="#fde68a" stroke-width="1.5"/>
    <text x="-135" y="14" font-size="12" font-weight="700" fill="#0f172a">• Tight (7): 4 flujos zlib + zune-jpeg (RGB)</text>
    <text x="-135" y="34" font-size="12" font-weight="700" fill="#0f172a">• ZRLE (16): tiles 64×64 + paleta/RLE (BGR)</text>
    <text x="-135" y="54" font-size="12" fill="#334155">• Zlib (6) · Hextile (5) · CopyRect (1) · Raw (0)</text>
    <text x="-135" y="74" font-size="12" fill="#6d28d9" font-weight="700">• Pseudo: Cursor (-239), DesktopSize, LastRect</text>
  </g>

  <!-- Node S3: Framebuffer + Dirty Rect -->
  <g transform="translate(885, 295)">
    <circle cx="0" cy="0" r="42" fill="#16a34a" filter="url(#badge-shadow)"/>
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <rect x="-6" y="-4" width="18" height="12" fill="#bbf7d0" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="62" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">3. Framebuffer BGRX</text>
    <text x="0" y="80" text-anchor="middle" font-size="11.5" fill="#475569">Arc&lt;Mutex&lt;Framebuffer&gt;&gt;</text>
    <text x="0" y="96" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="700">Acumula solo el Dirty Rect</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#64748b">+ Guarda miniatura .lcpv cada 5 s</text>
  </g>

  <!-- Node S4: GPU Texture Partial Upload -->
  <g transform="translate(1195, 295)">
    <circle cx="0" cy="0" r="42" fill="#2563eb" filter="url(#badge-shadow)"/>
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#ffffff"/>
    <text x="0" y="62" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">4. Textura GPU Parcial</text>
    <text x="0" y="80" text-anchor="middle" font-size="11.5" fill="#475569">TextureHandle::set_partial()</text>
    <text x="0" y="96" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">Convierte BGRX→RGBA solo</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#64748b">en la zona modificada (ahorra 95%)</text>
  </g>

  <!-- Node S5: Zero-Lag Local Cursor & Viewport -->
  <g transform="translate(1455, 295)">
    <circle cx="0" cy="0" r="42" fill="#7c3aed" filter="url(#badge-shadow)"/>
    <path d="M-8 -16 L-8 14 L0 7 L6 19 L11 16 L5 4 L16 4 Z" fill="#ffffff"/>
    <text x="0" y="62" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">5. Cursor Local (0 ms)</text>
    <text x="0" y="80" text-anchor="middle" font-size="11.5" fill="#475569">Se pinta en la posición del</text>
    <text x="0" y="96" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">ratón local sin esperar red</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#64748b">Escalado Fit / 1:1 Retina</text>
  </g>

  <!-- Top Section Arrows -->
  <line x1="198" y1="295" x2="332" y2="295" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="658" y1="295" x2="835" y2="295" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="935" y1="295" x2="1145" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1245" y1="295" x2="1405" y2="295" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <!-- ==================== BOTTOM SECTION: MOTOR DUAL DE ARCHIVOS (ULTRAVNC FT + SFTP v3) ==================== -->
  <rect x="30" y="510" width="1540" height="386" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2.2" filter="url(#shadow)"/>
  <rect x="30" y="510" width="1540" height="40" rx="16" fill="#dcfce7"/>
  <text x="54" y="536" font-size="15.5" font-weight="800" fill="#14532d">2. MOTOR DUAL DE ARCHIVOS EN SEGUNDO PLANO (UltraVNC File Transfer + SFTP v3 sobre SSH)</text>

  <!-- Node F1: Two-Pane UI (FilesView) -->
  <g transform="translate(165, 705)">
    <rect x="-110" y="-85" width="220" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <circle cx="0" cy="-40" r="28" fill="#0284c7" filter="url(#badge-shadow)"/>
    <rect x="-14" y="-50" width="12" height="20" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="2" y="-50" width="12" height="20" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <text x="0" y="8" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">FilesView (2 Paneles)</text>
    <text x="0" y="28" text-anchor="middle" font-size="11.5" fill="#475569">Local | Remoto + Drag&amp;Drop</text>
    <text x="0" y="46" text-anchor="middle" font-size="11.5" fill="#475569">Cola de subida/bajada,</text>
    <text x="0" y="64" text-anchor="middle" font-size="11.5" fill="#0369a1" font-weight="700">+Folder, Rename, Delete</text>
  </g>

  <!-- Node F2A: UltraVNC FT Engine -->
  <g transform="translate(565, 630)">
    <rect x="-145" y="-54" width="290" height="108" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="-102" cy="0" r="26" fill="#15803d"/>
    <text x="-102" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">FT7</text>
    <text x="-62" y="-20" font-size="13.5" font-weight="800" fill="#14532d">Motor A: UltraVNC FT (Msg 7)</text>
    <text x="-62" y="-1" font-size="11.5" fill="#334155">• Va dentro del mismo socket VNC</text>
    <text x="-62" y="16" font-size="11.5" fill="#334155">• Bloques 8/32 KiB + compresión zlib</text>
    <text x="-62" y="33" font-size="11" font-weight="700" fill="#15803d">• Carpetas remotas bajan como .zip</text>
  </g>

  <!-- Node F2B: SFTP v3 Engine -->
  <g transform="translate(565, 785)">
    <rect x="-145" y="-54" width="290" height="108" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="-102" cy="0" r="26" fill="#2563eb"/>
    <text x="-102" y="5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff">SFTP</text>
    <text x="-62" y="-20" font-size="13.5" font-weight="800" fill="#1e3a8a">Motor B: SFTP v3 (Fase 8.2)</text>
    <text x="-62" y="-1" font-size="11.5" fill="#334155">• Corre sobre ssh -s usuario@host sftp</text>
    <text x="-62" y="16" font-size="11.5" fill="#334155">• Funciona con x11vnc, TigerVNC, Mac</text>
    <text x="-62" y="33" font-size="11" font-weight="700" fill="#2563eb">• Y en modo «Solo Archivos» sin VNC</text>
  </g>

  <!-- Node F3: Streaming Threads (No Memory Bloat) -->
  <g transform="translate(995, 705)">
    <rect x="-135" y="-85" width="270" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="-40" r="28" fill="#d97706" filter="url(#badge-shadow)"/>
    <path d="M-12 -34 L0 -46 L12 -34 M0 -46 L0 -28" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="8" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Streaming por Bloques</text>
    <text x="0" y="28" text-anchor="middle" font-size="11.5" fill="#334155">• Subida en hilo propio (stream_upload)</text>
    <text x="0" y="46" text-anchor="middle" font-size="11.5" fill="#334155">• Descarga en hilo lector (Receiver)</text>
    <text x="0" y="64" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="700">• Archivos de varios GB usan ~64 KiB RAM</text>
  </g>

  <!-- Node F4: Atomic Safe Write (.lucarna-part) -->
  <g transform="translate(1395, 705)">
    <rect x="-140" y="-85" width="280" height="170" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <circle cx="0" cy="-40" r="28" fill="#dc2626" filter="url(#badge-shadow)"/>
    <path d="M0 -54 L13 -47 L13 -35 C13 -27 0 -22 0 -22 C0 -22 -13 -27 -13 -35 L-13 -47 Z" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <text x="0" y="8" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">Escritura Atómica y Sandbox</text>
    <text x="0" y="28" text-anchor="middle" font-size="11.5" fill="#334155">1. Sanea nombre (bloquea .., /, \, CON)</text>
    <text x="0" y="46" text-anchor="middle" font-size="11.5" fill="#334155">2. Escribe en .archivo.lucarna-part</text>
    <text x="0" y="64" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">3. Renombra al recibir EndOfFile</text>
  </g>

  <!-- Bottom Section Arrows -->
  <line x1="278" y1="675" x2="412" y2="635" stroke="#15803d" stroke-width="2.8" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <line x1="278" y1="735" x2="412" y2="780" stroke="#2563eb" stroke-width="2.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="712" y1="635" x2="852" y2="675" stroke="#15803d" stroke-width="2.8" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <line x1="712" y1="780" x2="852" y2="735" stroke="#2563eb" stroke-width="2.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="1132" y1="705" x2="1248" y2="705" stroke="#1e293b" stroke-width="3" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
</svg>
