# Builds the installers on every pull request (so packaging is checked on all three systems)
# and publishes them as the latest GitHub release when a version tag like v0.1.0 is pushed.
# The release page starts with packaging/release-notes.md (download links and install steps).
name: Packages

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/macos/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$version" packaging\windows\lucarna.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/windows/*.exe

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release
      - name: .deb and portable .tar.gz
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cargo deb --no-build --output "target/linux/lucarna_${version}_amd64.deb"
          dir="lucarna-${version}-linux-x86_64"
          mkdir -p "target/linux/$dir"
          cp target/release/lucarna packaging/linux/lucarna.desktop assets/logo.png LICENSE README.md "target/linux/$dir/"
          tar -C target/linux -czf "target/linux/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/linux/*.deb
            target/linux/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{VERSION}/${GITHUB_REF_NAME#v}/g" packaging/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Lucarna $GITHUB_REF_NAME" --notes "$(cat notes.md)" --generate-notes --latest
