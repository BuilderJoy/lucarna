[package]
name = "lucarna"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Cross-platform VNC viewer with UltraVNC file transfer"

[dependencies]
des = "0.9.0"
flate2 = "1.1"
eframe = { version = "0.37.0", features = ["persistence"] }
keyring = "4.2"
getrandom = "0.3"
sha2 = "0.11"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }
