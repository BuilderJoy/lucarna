[package]
name = "lucarna"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Cross-platform VNC viewer with UltraVNC file transfer"
repository = "https://github.com/BuilderJoy/lucarna"

# Linux .deb, built with cargo-deb (see .github/workflows/packages.yml).
[package.metadata.deb]
maintainer = "Lucarna <https://github.com/BuilderJoy/lucarna/issues>"
section = "net"
extended-description = "VNC viewer for macOS, Windows and Linux with UltraVNC file transfer, MS-Logon, chat and repeater support."
assets = [
    ["target/release/lucarna", "usr/bin/", "755"],
    ["packaging/linux/lucarna.desktop", "usr/share/applications/", "644"],
    ["assets/logo.png", "usr/share/icons/hicolor/512x512/apps/lucarna.png", "644"],
    ["LICENSE", "usr/share/doc/lucarna/copyright", "644"],
]

[dependencies]
des = "0.9.0"
flate2 = "1.1"
eframe = { version = "0.37.0", features = ["persistence"] }
keyring = "4.2"
getrandom = "0.3"
sha2 = "0.11"
lucide-icons = "1.59.0"
zune-jpeg = "0.5"
spake2 = "0.4.0"
curve25519-dalek = "4.1.3"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
